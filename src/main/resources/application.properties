# LLM Configuration
app.llm.base-url=http://localhost:11434/
app.llm.api-key=local
app.llm.model=qwen3.5:4b
app.llm.maxTokens=32768

# workspace
app.file.workspace=

# ============================================================
# RAG
# ============================================================
# app.rag
app.rag.enabled=true
app.rag.chunk.strategy=AUTO
app.rag.chunk.parent-child=false
app.rag.chunk.parent-size=4096
app.rag.chunk.child-size=512
app.rag.chunk.chunk-size=512
app.rag.chunk.chunk-overlap=80
# app.rag.search
app.rag.search.vector-top-k=30
app.rag.search.keyword-top-k=30
app.rag.search.rerank-top-k=5
app.rag.search.vector-threshold=0.2
app.rag.search.keyword-threshold=0.3
app.rag.search.rrf-k=60
app.rag.search.rrf-vector-weight=0.7
app.rag.search.rrf-keyword-weight=0.3
# app.rag.embedding
app.rag.embedding.url=http://localhost:11434/api/embed
app.rag.embedding.model=qwen3-embedding:4b
app.rag.embedding.dimension=2560
app.rag.embedding.batch-size=8
# app.rag.llm
app.rag.llm.base-url=http://localhost:11434/v1
app.rag.llm.model=qwen3.5:4b
app.rag.llm.api-key=
app.rag.llm.temperature=0.2
app.rag.llm.max-tokens=2048
app.rag.llm.timeout-seconds=180
# app.rag.rerank
# X-inference provide-rerank
app.rag.rerank.provider=xinference
app.rag.rerank.base-url=http://127.0.0.1:9997/
app.rag.rerank.model=bge-reranker-v2-m3
app.rag.rerank.api-key=xf-Hh5RoqNFNTGQaF9IvIqNTdtgVJuSfMgXaEurUT6iyMFEMAEo
# app.rag.datasource
app.rag.datasource.url=jdbc:postgresql://localhost:5432/iagent
app.rag.datasource.username=postgres
app.rag.datasource.password=sagAdmin888

# ============================================================
# fin-filing
# ============================================================
app.rag.filing.enabled=false
app.rag.filing.knowledge-base-id=filing
app.rag.filing.chunk.strategy=HEADING
app.rag.filing.chunk.parent-child=false
app.rag.filing.chunk.parent-size=4096
app.rag.filing.chunk.child-size=1024
app.rag.filing.chunk.chunk-size=1024
app.rag.filing.chunk.chunk-overlap=80
app.rag.filing.search.default-top-k=5

# ============================================================
# financial-data
# ============================================================
app.financial.enabled=true
app.financial.default-periods=16
app.financial.default-query-periods=6
app.financial.min-periods-for-query=4
app.financial.python-timeout-seconds=300
app.financial.rag-extract-enabled=false
