# LLM Configuration
app.llm.base-url=http://localhost:11434/
app.llm.api-key=local
app.llm.model=qwen3.5:4b
app.llm.maxTokens=32768

# workspace
app.file.workspace=

# Filing RAG QA subsystem (disabled by default; enable with app.filing-rag.enabled=true)
app.filing-rag.enabled=false
app.filing-rag.backend=milvus

# rag-chunk
app.filing-rag.chunk.target-tokens=512
app.filing-rag.chunk.max-tokens=600
app.filing-rag.chunk.overlap-tokens=80
# rag-search
app.filing-rag.search.top-k=5
app.filing-rag.search.similarity-threshold=0.30
app.filing-rag.search.vector-multiplier=3
# rag-embed
app.filing-rag.ollama.embed-url=http://localhost:11434/api/embed
app.filing-rag.ollama.embed-model=qwen3-embedding:4b
app.filing-rag.ollama.dimension=2560
# rag-llm
app.filing-rag.llm.base-url=http://localhost:11434/v1
app.filing-rag.llm.model=qwen3.5:4b
app.filing-rag.llm.temperature=0.2
app.filing-rag.llm.max-tokens=20480
# rag-milvus
app.filing-rag.milvus.endpoint=http://127.0.0.1:19530
app.filing-rag.milvus.token=
app.filing-rag.milvus.collection=invest_filing
app.filing-rag.milvus.insert-batch-size=100
# rag-ragflow
app.filing-rag.ragflow.base-url=http://localhost:9380
app.filing-rag.ragflow.api-key=${RAGFLOW_API_KEY:}
app.filing-rag.ragflow.dataset-prefix=filing_rag_
app.filing-rag.ragflow.similarity-threshold=0.3
app.filing-rag.ragflow.keyword-weight=0.3
app.filing-rag.ragflow.parse-poll-timeout-seconds=300
app.filing-rag.ragflow.parse-poll-interval-seconds=3
app.filing-rag.ragflow.request-timeout-seconds=60

# ============================================================
# RAG
# ============================================================
# app.rag
app.rag.enabled=true
app.rag.chunk.strategy=AUTO
app.rag.chunk.parent-child=false
app.rag.chunk.parent-size=4096
app.rag.chunk.child-size=512
app.rag.chunk.chunk-size=512
app.rag.chunk.chunk-overlap=80
# app.rag.search
app.rag.search.vector-top-k=30
app.rag.search.keyword-top-k=30
app.rag.search.rerank-top-k=5
app.rag.search.vector-threshold=0.2
app.rag.search.keyword-threshold=0.3
app.rag.search.rrf-k=60
app.rag.search.rrf-vector-weight=0.7
app.rag.search.rrf-keyword-weight=0.3
# app.rag.embedding
app.rag.embedding.url=http://localhost:11434/api/embed
app.rag.embedding.model=qwen3-embedding:4b
app.rag.embedding.dimension=2560
app.rag.embedding.batch-size=8
# app.rag.llm
app.rag.llm.base-url=http://localhost:11434/v1
app.rag.llm.model=qwen3.5:4b
app.rag.llm.api-key=
app.rag.llm.temperature=0.2
app.rag.llm.max-tokens=2048
app.rag.llm.timeout-seconds=180
# app.rag.rerank
app.rag.rerank.base-url=http://localhost:11434/v1
app.rag.rerank.model=dengcao/Qwen3-Reranker-4B:Q4_K_M
app.rag.rerank.api-key=
app.rag.rerank.max-tokens=40960
app.rag.rerank.timeout-seconds=180
# app.rag.datasource
app.rag.datasource.url=jdbc:postgresql://localhost:5432/iagent
app.rag.datasource.username=postgres
app.rag.datasource.password=sagAdmin888

# ============================================================
# 财报知识库 filingkb（构建于 rag 之上；需 app.rag.enabled=true）
# ============================================================
app.filing-kb.enabled=false
app.filing-kb.knowledge-base-id=filing
app.filing-kb.chunk.strategy=HEADING
app.filing-kb.chunk.parent-child=false
app.filing-kb.chunk.parent-size=4096
app.filing-kb.chunk.child-size=1024
app.filing-kb.chunk.chunk-size=1024
app.filing-kb.chunk.chunk-overlap=80
app.filing-kb.search.default-top-k=5
