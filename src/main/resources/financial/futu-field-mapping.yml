# futu get_financials_statements 字段映射：市场 → 报表 → 标准指标编码 → futu field_id 列表
# - field_id 命名空间按市场划分：美股 8xxx / 港股 5xxx / A股 3xxx；同一 id 在不同报表含义不同，故按报表分组
# - 值为 field_id 列表：多个 id 表示求和（如港股 CapEx = 购建固定资产 5071 + 购建无形资产 5073）
# - financial_type: futu 财报类型（10=美股单季+年报，11=港股/A股累计 Q1/H1/9M/FY）
# - cumulative: true 表示 API 返回的是年内累计值，入库前需差分出单季度
# 未列出的指标表示该市场 API 不提供（值留空，或由派生/RAG 补充）

