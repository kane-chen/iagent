  - { code: TOTAL_CURRENT_LIABILITIES,   name_cn: 流动负债合计,   name_en: Total current liabilities, statement: balance, parent: TOTAL_LIABILITIES,          sort_order: 210, value_type: STOCK, unit: million, aliases: [流动负债合计, 流动负债, current liabilities] }
  - { code: SHORT_TERM_BORROWING,        name_cn: 短期借款,      name_en: Short-term borrowing,     statement: balance, parent: TOTAL_CURRENT_LIABILITIES,  sort_order: 211, value_type: STOCK, unit: million, aliases: [短期借款, short term borrowing, short term debt] }
  - { code: ACCOUNTS_PAYABLE,            name_cn: 应付账款,      name_en: Accounts payable,         statement: balance, parent: TOTAL_CURRENT_LIABILITIES,  sort_order: 212, value_type: STOCK, unit: million, aliases: [应付账款, accounts payable, payables] }
  - { code: TOTAL_NONCURRENT_LIABILITIES, name_cn: 非流动负债合计, name_en: Non-current liabilities, statement: balance, parent: TOTAL_LIABILITIES,          sort_order: 220, value_type: STOCK, unit: million, aliases: [非流动负债合计, 非流动负债, non current liabilities] }
  - { code: LONG_TERM_BORROWING,         name_cn: 长期借款,      name_en: Long-term borrowing,      statement: balance, parent: TOTAL_NONCURRENT_LIABILITIES, sort_order: 221, value_type: STOCK, unit: million, aliases: [长期借款, long term borrowing, long term debt] }
