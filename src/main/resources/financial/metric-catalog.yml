# 标准财务指标目录树（跨公司统一）
# - code: 稳定英文编码，入库 metric_code
# - name_cn/name_en: 中英文名
# - statement: income(利润表) / balance(资产负债表) / cashflow(现金流量表)
# - parent: 父指标编码（分层展示）；null 为顶层
# - value_type: FLOW(期间量) / STOCK(时点数) / RATIO(比率)
# - unit: million(百万财报币种) / percent(百分比)
# - derived: true 表示由其他指标计算得出
# - aliases: 查询时的别名（中英文，小写匹配）
# sort_order 控制同层展示顺序

metrics:
  # ===================== 利润表 =====================
  - { code: REVENUE,            name_cn: 营业总收入,       name_en: Total revenue,            statement: income, parent: null,                sort_order: 10,  value_type: FLOW,  unit: million, aliases: [营业收入, 营收, 收入, revenue, total revenue] }
  - { code: TOTAL_OPERATING_COST, name_cn: 营业总成本,    name_en: Total operating cost,     statement: income, parent: null,                sort_order: 20,  value_type: FLOW,  unit: million, aliases: [营业总成本, total operating cost] }
  - { code: COST_OF_REVENUE,    name_cn: 营业成本,        name_en: Cost of revenue,          statement: income, parent: TOTAL_OPERATING_COST, sort_order: 21, value_type: FLOW, unit: million, aliases: [销售成本, 营业成本, cost of revenue, cost of sales, cogs] }
  - { code: OPERATING_EXPENSES, name_cn: 营业费用,        name_en: Operating expenses,       statement: income, parent: TOTAL_OPERATING_COST, sort_order: 22, value_type: FLOW, unit: million, aliases: [营业费用, 运营费用, 经营开支, 經營開支, 經營費用, 经营费用, operating expenses, opex] }
  - { code: SELLING_EXPENSE,    name_cn: 销售费用,        name_en: Selling expense,          statement: income, parent: OPERATING_EXPENSES, sort_order: 221, value_type: FLOW, unit: million, aliases: [销售费用, 销售及分销成本, 营销费用, selling expense, s&m, sales and marketing] }
  - { code: GA_EXPENSE,         name_cn: 管理费用,        name_en: G&A expense,              statement: income, parent: OPERATING_EXPENSES, sort_order: 222, value_type: FLOW, unit: million, aliases: [管理费用, 行政开支, 一般及行政费用, g&a, general and administrative] }
  - { code: RD_EXPENSE,         name_cn: 研发费用,        name_en: R&D expense,              statement: income, parent: OPERATING_EXPENSES, sort_order: 223, value_type: FLOW, unit: million, aliases: [研发费用, 研发开支, r&d, research and development] }
  - { code: SGA_EXPENSE,        name_cn: 销售管理费用合计, name_en: Selling & administrative, statement: income, parent: OPERATING_EXPENSES, sort_order: 224, value_type: FLOW, unit: million, aliases: [销售和管理费用, sg&a, selling general administrative] }
  - { code: SBC_EXPENSE,        name_cn: 股份支付费用,    name_en: Share-based compensation, statement: income, parent: OPERATING_EXPENSES, sort_order: 225, value_type: FLOW, unit: million, aliases: [股份支付, 股权激励费用, 股份酬金, sbc, share based compensation, stock based compensation, stock compensation expense] }
  - { code: GROSS_PROFIT,       name_cn: 毛利,            name_en: Gross profit,             statement: income, parent: null,                sort_order: 30,  value_type: FLOW,  unit: million, derived: true, aliases: [毛利, gross profit, gross income] }
  - { code: OPERATING_INCOME,   name_cn: 营业利润,        name_en: Operating income,         statement: income, parent: null,                sort_order: 40,  value_type: FLOW,  unit: million, aliases: [营业利润, 经营利润, operating income, operating profit] }
  - { code: DA_EXPENSE,         name_cn: 折旧与摊销,      name_en: D&A (income statement),   statement: income, parent: null,                sort_order: 45,  value_type: FLOW,  unit: million, aliases: [折旧摊销, 折旧与摊销, depreciation amortization] }
  - { code: NET_FINANCE_COST,   name_cn: 财务费用净额,    name_en: Net finance cost,         statement: income, parent: null,                sort_order: 50,  value_type: FLOW,  unit: million, aliases: [财务费用, 财务成本, 财务费用净额, finance cost, financial expenses] }
  - { code: FINANCE_INCOME,     name_cn: 财务收入,        name_en: Finance income,           statement: income, parent: NET_FINANCE_COST,   sort_order: 51,  value_type: FLOW,  unit: million, aliases: [财务收入, 利息收入, finance income] }
  - { code: INTEREST_EXPENSE,   name_cn: 利息费用,        name_en: Interest expense,         statement: income, parent: NET_FINANCE_COST,   sort_order: 52,  value_type: FLOW,  unit: million, aliases: [利息费用, 利息开支, interest expense] }
  - { code: PRETAX_INCOME,      name_cn: 税前利润,        name_en: Pre-tax income,           statement: income, parent: null,                sort_order: 60,  value_type: FLOW,  unit: million, aliases: [税前利润, 利润总额, pretax income, income before tax] }
  - { code: INCOME_TAX,         name_cn: 所得税,          name_en: Income tax,               statement: income, parent: null,                sort_order: 70,  value_type: FLOW,  unit: million, aliases: [所得税, 所得税费用, income tax, tax expense] }
  - { code: NET_INCOME,         name_cn: 净利润,          name_en: Net income,               statement: income, parent: null,                sort_order: 80,  value_type: FLOW,  unit: million, aliases: [净利润, 本年利润, net income, net profit] }
  - { code: NET_INCOME_PARENT,  name_cn: 归母净利润,      name_en: Net income to parent,     statement: income, parent: NET_INCOME,         sort_order: 81,  value_type: FLOW,  unit: million, aliases: [归母净利润, 归属母公司净利润, 归属于母公司股东净利润, net income attributable to parent] }
  - { code: EBITDA,             name_cn: EBITDA,          name_en: EBITDA,                  statement: income, parent: null,                sort_order: 41,  value_type: FLOW,  unit: million, aliases: [息税折旧摊销前利润, ebitda, 息税折旧及摊销前利润] }
  - { code: ADJUSTED_EBITDA,    name_cn: Adjusted EBITDA, name_en: Adjusted EBITDA,          statement: income, parent: null,                sort_order: 42,  value_type: FLOW,  unit: million, aliases: [调整后ebitda, adjusted ebitda, 经调整ebitda] }
  - { code: EBIT,               name_cn: 息税前利润,       name_en: EBIT,                    statement: income, parent: null,                sort_order: 43,  value_type: FLOW,  unit: million, aliases: [息税前利润, ebit] }
  - { code: ADJUSTED_EBITA,     name_cn: 调整后EBITA,     name_en: Adjusted EBITA,          statement: income, parent: null,                sort_order: 44,  value_type: FLOW,  unit: million, aliases: [调整后ebita, 经调整ebita, adjusted ebita, ebita利润率, 分部ebita] }
  - { code: NON_GAAP_NET_INCOME, name_cn: Non-GAAP净利润, name_en: Non-GAAP net income,      statement: income, parent: null,                sort_order: 82,  value_type: FLOW,  unit: million, aliases: [non-gaap净利润, 非公认会计准则净利润, 经调整净利润, 调整后净利润, non gaap net income, adjusted net income] }

