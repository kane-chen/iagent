  - { code: LEASE_LIABILITY,             name_cn: 租赁负债,      name_en: Lease liabilities,        statement: balance, parent: TOTAL_NONCURRENT_LIABILITIES, sort_order: 223, value_type: STOCK, unit: million, aliases: [租赁负债, lease liability] }
  - { code: TOTAL_EQUITY,           name_cn: 股东权益合计,   name_en: Total equity,             statement: balance, parent: null,                  sort_order: 300, value_type: STOCK, unit: million, aliases: [股东权益合计, 股东权益, 所有者权益, total equity, shareholders equity] }
  - { code: EQUITY_PARENT,          name_cn: 归母权益,       name_en: Equity to parent,         statement: balance, parent: TOTAL_EQUITY,         sort_order: 301, value_type: STOCK, unit: million, aliases: [归母权益, 归属母公司所有者权益, 归属于母公司股东权益, equity attributable to parent] }
