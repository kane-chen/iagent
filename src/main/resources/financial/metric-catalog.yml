  - { code: TOTAL_CURRENT_ASSETS,    name_cn: 流动资产合计,   name_en: Total current assets,     statement: balance, parent: TOTAL_ASSETS,           sort_order: 110, value_type: STOCK, unit: million, aliases: [流动资产合计, 流动资产, current assets] }
  - { code: CASH_AND_EQUIVALENTS,    name_cn: 货币资金,       name_en: Cash & equivalents,       statement: balance, parent: TOTAL_CURRENT_ASSETS,   sort_order: 111, value_type: STOCK, unit: million, aliases: [货币资金, 现金及现金等价物, 现金, cash, cash and equivalents] }
