# Test LLM Configuration
app.llm.base-url=http://192.168.1.6:11434/
app.llm.api-key=local
app.llm.model=qwen3.5:4b
#app.llm.base-url=https://dashscope.aliyuncs.com/compatible-mode
#app.llm.api-key=sk-
#app.llm.model=qwen-plus
app.llm.maxTokens=32768

# workspace
app.workspace.base-dir=


# Filing RAG QA subsystem (disabled by default; individual smoke tests enable via @TestPropertySource)
app.filing-rag.enabled=true
app.filing-rag.backend=textsearch
app.filing-rag.chunk.target-tokens=400
app.filing-rag.chunk.max-tokens=600
app.filing-rag.chunk.overlap-tokens=80
app.filing-rag.search.top-k=5
app.filing-rag.search.similarity-threshold=0.20
app.filing-rag.search.vector-multiplier=3
app.filing-rag.llm.base-url=http://192.168.1.6:11434/v1
app.filing-rag.llm.model=qwen3.5:4b
#app.filing-rag.llm.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
#app.filing-rag.llm.api-key=sk-
#app.filing-rag.llm.model=qwen-plus
app.filing-rag.llm.temperature=0.3
app.filing-rag.llm.max-tokens=32768


# app.rag
app.rag.enabled=true
app.rag.chunk.strategy=AUTO
app.rag.chunk.parent-child=false
app.rag.chunk.parent-size=4096
app.rag.chunk.child-size=1024
app.rag.chunk.chunk-size=1024
app.rag.chunk.chunk-overlap=80
# app.rag.search
app.rag.search.vector-top-k=30
app.rag.search.keyword-top-k=30
app.rag.search.rerank-top-k=5
app.rag.search.vector-threshold=0.2
app.rag.search.keyword-threshold=0.3
app.rag.search.rrf-k=60
app.rag.search.rrf-vector-weight=0.7
app.rag.search.rrf-keyword-weight=0.3
# app.rag.embedding
app.rag.embedding.url=http://localhost:11434/api/embed
app.rag.embedding.model=qwen3-embedding:4b
app.rag.embedding.dimension=2560
app.rag.embedding.batch-size=8
# app.rag.llm
app.rag.llm.base-url=http://localhost:11434/v1
app.rag.llm.model=qwen3.5:4b
app.rag.llm.api-key=
app.rag.llm.temperature=0.2
app.rag.llm.max-tokens=2048
app.rag.llm.timeout-seconds=180
